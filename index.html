<script>
        let RAW_DATA = [];
        let currentFilteredData = [];
        let favorites = [];
        let sortState = { col: null, dir: 'asc' };

        const keys = ['region', 'univ', 'course', 'cat', 'est', 'dept', 'cert', 'subj'];
        const colIndexes = { region: 0, univ: 1, course: 2, cat: 3, est: 4, dept: 5, cert: 6, subj: 7 };

        const filterState = {
            region: new Set(),
            univ: new Set(),
            course: new Set(),
            cat: new Set(),
            est: new Set(),
            dept: new Set(),
            cert: new Set(),
            subj: new Set()
        };

        window.addEventListener('DOMContentLoaded', async () => {
            await loadFavoritesFromServer();
            autoLoadExcelData();

            document.addEventListener('click', (e) => {
                if (!e.target.closest('.form-group')) {
                    closeAllDropdowns();
                }
            });
        });

        // --- 서버 동기화 함수 ---
        async function loadFavoritesFromServer() {
            try {
                const res = await fetch('/api/favorites');
                if (res.ok) {
                    favorites = await res.json();
                }
            } catch (err) {
                console.error('즐겨찾기 서버 로드 실패:', err);
            }
            renderFavorites();
        }

        async function saveFavorites() {
            try {
                await fetch('/api/favorites', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(favorites)
                });
            } catch (err) {
                console.error('즐겨찾기 서버 저장 실패:', err);
            }
            renderFavorites();
        }

        // --- 엑셀 로드 및 파싱 함수 ---
        function autoLoadExcelData() {
            const cacheBustingUrl = "data.xlsx?v=" + new Date().getTime();

            fetch(cacheBustingUrl)
                .then(res => {
                    if (!res.ok) throw new Error("파일 로드 에러 (Status: " + res.status + ")");
                    return res.arrayBuffer();
                })
                .then(buffer => {
                    parseAndLoadExcel(buffer, true);
                })
                .catch(err => {
                    console.error("엑셀 자동 로드 실패:", err);
                    document.getElementById('resultCount').innerText = "엑셀 연동 필요";
                    document.getElementById('resultTbody').innerHTML = `
                        <tr>
                            <td colspan="11" style="text-align:center; padding: 3rem; color: #64748b;">
                                ⚠️ 서버 내부에서 data.xlsx 파일을 자동으로 로드하지 못했습니다.<br>
                                <strong>해결 방법:</strong><br>
                                1. 최상위 폴더에 파일명이 정확히 소문자 <strong>data.xlsx</strong>로 업로드되었는지 확인해 주세요.<br>
                                2. 서버 배포 후 반영까지 1~2분의 시간이 소요될 수 있습니다.
                            </td>
                        </tr>`;
                });
        }

        function parseAndLoadExcel(arrayBuffer, isAutoFetch = false) {
            try {
                const readOptions = isAutoFetch ? { type: 'array', bookType: 'xlsx' } : { type: 'array' };
                const workbook = XLSX.read(arrayBuffer, readOptions);
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(worksheet);
                
                const parsedData = [];
                jsonData.forEach(row => {
                    const status = row['폐지여부'] || '';
                    if (status.toString().trim() === 'Y') return;

                    const region = (row['소재지'] || '').toString().trim();
                    const univ = (row['대학명'] || '').toString().trim();
                    const course = (row['양성과정(공시)'] || row['양성과정'] || '').toString().trim();
                    const cat = (row['대학구분'] || '').toString().trim();
                    const est = (row['설립유형'] || '').toString().trim();
                    const dept = (row['학과명'] || '').toString().trim();
                    const cert = (row['자격종별'] || '').toString().trim();
                    const subj = (row['표시과목'] || '').toString().trim();

                    if (univ || dept) {
                        parsedData.push([region, univ, course, cat, est, dept, cert, subj]);
                    }
                });

                if (parsedData.length > 0) {
                    RAW_DATA = parsedData;
                    initDropdownMenus();
                    applyAllFilters();
                } else {
                    alert('엑셀 파일 양식 혹은 데이터 구조를 확인해 주세요.');
                }
            } catch (error) {
                console.error("데이터 파싱 에러:", error);
                alert("엑셀 파일 파싱 중 에러가 발생했습니다.");
            }
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                parseAndLoadExcel(e.target.result, false);
                alert(`총 ${RAW_DATA.length}건의 데이터를 수동 연동했습니다.`);
            };
            reader.readAsArrayBuffer(file);
        }

        // --- 검색 드롭다운 & 필터링 로직 ---
        function initDropdownMenus() {
            keys.forEach(key => {
                const colIdx = colIndexes[key];
                const uniqueValues = Array.from(new Set(RAW_DATA.map(row => row[colIdx]).filter(val => val && val !== ""))).sort();
                
                const containerEl = document.getElementById(`items-${key}`);
                if (!containerEl) return;
                containerEl.innerHTML = uniqueValues.map((val) => `
                    <label class="dropdown-item" data-value="${val}">
                        <input type="checkbox" value="${val}" ${filterState[key].has(val) ? 'checked' : ''} onchange="onCheckboxChange('${key}', '${val}', this.checked)">
                        <span>${val}</span>
                    </label>
                `).join('');
            });
        }

        function updateDropdownMenus() {
            keys.forEach(targetKey => {
                const availableData = RAW_DATA.filter(row => {
                    return keys.every(key => {
                        if (key === targetKey) return true;
                        const selectedSet = filterState[key];
                        if (selectedSet.size === 0) return true;
                        return selectedSet.has(row[colIndexes[key]]);
                    });
                });

                const colIdx = colIndexes[targetKey];
                const validValues = new Set(availableData.map(row => row[colIdx]).filter(v => v !== ""));

                const containerEl = document.getElementById(`items-${targetKey}`);
                if (!containerEl) return;
                const items = containerEl.querySelectorAll('.dropdown-item');

                items.forEach(item => {
                    const input = item.querySelector('input');
                    const val = item.getAttribute('data-value');

                    if (validValues.has(val)) {
                        const menuEl = document.getElementById(`menu-${targetKey}`);
                        const searchInput = menuEl.querySelector('.dropdown-search-input');
                        const keyword = searchInput ? searchInput.value.trim().toLowerCase() : "";

                        if (keyword === "" || val.toLowerCase().includes(keyword)) {
                            item.style.display = 'flex';
                        } else {
                            item.style.display = 'none';
                        }
                    } else {
                        item.style.display = 'none';
                        if (filterState[targetKey].has(val)) {
                            filterState[targetKey].delete(val);
                            input.checked = false;
                        }
                    }
                });

                updateDropdownButtonText(targetKey);
            });
        }

        function filterDropdownItems(key, keyword) {
            const cleanKeyword = keyword.trim().toLowerCase();
            const containerEl = document.getElementById(`items-${key}`);
            if (!containerEl) return;
            const items = containerEl.querySelectorAll('.dropdown-item');

            const availableData = RAW_DATA.filter(row => {
                return keys.every(k => {
                    if (k === key) return true;
                    const selectedSet = filterState[k];
                    if (selectedSet.size === 0) return true;
                    return selectedSet.has(row[colIndexes[k]]);
                });
            });
            const validValues = new Set(availableData.map(row => row[colIndexes[key]]).filter(v => v !== ""));

            items.forEach(item => {
                const val = item.getAttribute('data-value');
                if (validValues.has(val) && (cleanKeyword === "" || val.toLowerCase().includes(cleanKeyword))) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        function toggleDropdown(key, event) {
            event.stopPropagation();
            const targetMenu = document.getElementById(`menu-${key}`);
            const isOpen = targetMenu.classList.contains('show');
            
            closeAllDropdowns();
            
            if (!isOpen) {
                targetMenu.classList.add('show');
                const searchInput = targetMenu.querySelector('.dropdown-search-input');
                if (searchInput) {
                    searchInput.value = "";
                    filterDropdownItems(key, "");
                    setTimeout(() => searchInput.focus(), 50);
                }
            }
        }

        function closeAllDropdowns() {
            document.querySelectorAll('.dropdown-menu').forEach(menu => menu.classList.remove('show'));
        }

        function onCheckboxChange(key, value, isChecked) {
            if (isChecked) {
                filterState[key].add(value);
            } else {
                filterState[key].delete(value);
            }
            applyAllFilters();
        }

        function updateDropdownButtonText(key) {
            const btnTextEl = document.getElementById('btn-text-' + key);
            if (!btnTextEl) return;
            const selectedArray = Array.from(filterState[key]);

            if (selectedArray.length === 0) {
                btnTextEl.innerText = "전체 선택";
            } else if (selectedArray.length === 1) {
                btnTextEl.innerText = selectedArray[0];
            } else {
                btnTextEl.innerText = `${selectedArray[0]} 외 ${selectedArray.length - 1}개`;
            }
        }

        function applyAllFilters() {
            currentFilteredData = RAW_DATA.filter(row => {
                return keys.every(key => {
                    const selectedSet = filterState[key];
                    if (selectedSet.size === 0) return true;
                    return selectedSet.has(row[colIndexes[key]]);
                });
            });

            updateDropdownMenus();

            if (sortState.col !== null) {
                executeSort();
            } else {
                renderTable(currentFilteredData);
            }
        }

        function sortTable(columnIndex) {
            if (sortState.col === columnIndex) {
                sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
            } else {
                sortState.col = columnIndex;
                sortState.dir = 'asc';
            }

            for (let i = 0; i < 8; i++) {
                const icon = document.getElementById(`sort${i}`);
                if (i === columnIndex) {
                    icon.innerText = sortState.dir === 'asc' ? '▲' : '▼';
                    icon.style.color = '#2563eb';
                } else {
                    icon.innerText = '⇅';
                    icon.style.color = '#94a3b8';
                }
            }

            executeSort();
        }

        function executeSort() {
            const col = sortState.col;
            const dir = sortState.dir === 'asc' ? 1 : -1;

            currentFilteredData.sort((a, b) => {
                const valA = (a[col] || '').toString();
                const valB = (b[col] || '').toString();
                return valA.localeCompare(valB, 'ko') * dir;
            });

            renderTable(currentFilteredData);
        }

        function resetFilters() {
            keys.forEach(key => {
                filterState[key].clear();
                const menuEl = document.getElementById(`menu-${key}`);
                if (menuEl) {
                    const searchInput = menuEl.querySelector('.dropdown-search-input');
                    if (searchInput) searchInput.value = "";
                }
            });
            document.querySelectorAll('.dropdown-menu input[type="checkbox"]').forEach(cb => cb.checked = false);

            sortState = { col: null, dir: 'asc' };
            for (let i = 0; i < 8; i++) {
                const icon = document.getElementById(`sort${i}`);
                if (icon) {
                    icon.innerText = '⇅';
                    icon.style.color = '#94a3b8';
                }
            }

            closeAllDropdowns();
            initDropdownMenus();
            applyAllFilters();
        }

        // --- 테이블 및 즐겨찾기 렌더링 ---
        function renderTable(data) {
            const tbody = document.getElementById('resultTbody');
            document.getElementById('resultCount').innerText = `검색 결과: ${data.length}건`;
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="11" style="text-align:center; padding: 2.5rem; color: #94a3b8;">검색 조건에 일치하는 데이터가 없습니다.</td></tr>`;
                return;
            }

            const fragment = document.createDocumentFragment();
            data.forEach((row, index) => {
                const [region, univ, course, cat, est, dept, cert, subj] = row;
                const portalLink = `https://search.naver.com/search.naver?query=${encodeURIComponent(univ + ' 입학처')}`;
                
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="text-align: center; font-weight: 600; color: #64748b; background: #f8fafc;">${index + 1}</td>
                    <td><span class="tag-region">${region || '-'}</span></td>
                    <td><strong>${univ}</strong></td>
                    <td><span class="tag-course">${course || '-'}</span></td>
                    <td>${cat || '-'}</td>
                    <td>${est || '-'}</td>
                    <td>${dept || '-'}</td>
                    <td>${cert || '-'}</td>
                    <td>${subj || '-'}</td>
                    <td style="text-align: center; white-space: nowrap;">
                        <button class="btn-star" onclick='addFavorite(${JSON.stringify(row)})'>★ 등록</button>
                    </td>
                    <td style="text-align: center; white-space: nowrap;">
                        <a href="${portalLink}" target="_blank" rel="noopener noreferrer" class="btn-link">
                            🔗 입학처
                        </a>
                    </td>
                `;
                fragment.appendChild(tr);
            });
            tbody.appendChild(fragment);
        }

        function addFavorite(row) {
            const [region, univ, course, cat, est, dept, cert, subj] = row;
            const id = `${region}_${univ}_${course}_${dept}_${cert}_${subj}`;

            if (favorites.some(f => f.id === id)) {
                alert('이미 즐겨찾기에 등록된 항목입니다.');
                return;
            }

            favorites.push({ id, region, univ, course, dept, cert, subj });
            saveFavorites();
        }

        function removeFavorite(id) {
            favorites = favorites.filter(f => f.id !== id);
            saveFavorites();
        }

        function deleteSelectedFavorites() {
            const checkedBoxes = document.querySelectorAll('.fav-cb:checked');
            if (checkedBoxes.length === 0) {
                alert('삭제할 즐겨찾기 항목을 선택해주세요.');
                return;
            }
            if (!confirm(`선택한 ${checkedBoxes.length}개 항목을 즐겨찾기에서 삭제하시겠습니까?`)) return;

            const idsToDelete = Array.from(checkedBoxes).map(cb => cb.value);
            favorites = favorites.filter(f => !idsToDelete.includes(f.id));
            saveFavorites();
        }

        function clearAllFavorites() {
            if (favorites.length === 0) {
                alert('삭제할 즐겨찾기 항목이 없습니다.');
                return;
            }
            if (!confirm('즐겨찾기 항목을 모두 삭제하시겠습니까?')) return;

            favorites = [];
            saveFavorites();
        }

        function toggleSelectAllFavs(isChecked) {
            document.querySelectorAll('.fav-cb').forEach(cb => cb.checked = isChecked);
        }

        function updateFavSelectAllStatus() {
            const checkboxes = document.querySelectorAll('.fav-cb');
            const checkedBoxes = document.querySelectorAll('.fav-cb:checked');
            const selectAllCb = document.getElementById('favSelectAll');
            if (selectAllCb) {
                selectAllCb.checked = checkboxes.length > 0 && checkboxes.length === checkedBoxes.length;
            }
        }

        function renderFavorites() {
            const favContainer = document.getElementById('favList');
            document.getElementById('favCount').innerText = favorites.length;
            
            const selectAllCb = document.getElementById('favSelectAll');
            if (selectAllCb) selectAllCb.checked = false;

            favContainer.innerHTML = '';

            if (favorites.length === 0) {
                favContainer.innerHTML = `<div class="empty-fav">즐겨찾기 항목이 없습니다.<br>원하는 항목의 [★ 등록] 버튼을 눌러보세요.</div>`;
                return;
            }

            favorites.forEach(item => {
                const portalLink = `https://search.naver.com/search.naver?query=${encodeURIComponent(item.univ + ' 입학처')}`;
                const card = document.createElement('div');
                card.className = 'fav-card';
                
                const regionBadge = item.region ? `<span class="tag-region">${item.region}</span> ` : '';
                const courseBadge = item.course ? `<span class="tag-course">${item.course}</span> ` : '';

                card.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <h4>
                            <input type="checkbox" class="fav-cb" value="${item.id}" onchange="updateFavSelectAllStatus()">
                            ${regionBadge}${item.univ}
                        </h4>
                        <button class="btn-del" onclick="removeFavorite('${item.id}')">삭제</button>
                    </div>
                    <p style="margin-top: 4px;">${courseBadge}<strong>학과:</strong> ${item.dept || '-'}</p>
                    <p><strong>자격/과목:</strong> ${item.cert || '-'} ${item.subj ? `(${item.subj})` : ''}</p>
                    <div class="fav-actions">
                        <a href="${portalLink}" target="_blank" rel="noopener noreferrer" class="btn-link">🔗 입학처 이동</a>
                    </div>
                `;
                favContainer.appendChild(card);
            });
        }
    </script>
